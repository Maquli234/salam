expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_fopen = Off
allow_url_include = Off
open_basedir = /var/www/html:/var/www/app:/tmp
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,dl,show_source,symlink,link
file_uploads = Off
max_execution_time = 10
memory_limit = 64M
session.use_strict_mode = 1
